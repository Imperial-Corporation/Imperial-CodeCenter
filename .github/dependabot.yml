# Une seule pull request groupée par écosystème, une fois par mois (pas de flot de PR).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
  - package-ecosystem: cargo
    directory: /engine
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      rust: { patterns: ["*"] }
  - package-ecosystem: uv
    directory: /api
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      python: { patterns: ["*"] }
