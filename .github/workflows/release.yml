# Imperial CodeCenter — https://imperial-corporation.pages.dev/icc
# Copyright (c) Imperial. Imperial Community License 1.0 (voir LICENSE) : gratuit, code ouvert, origine à conserver.
#
# Publication automatique à chaque tag `vX.Y.Z` (créé par ./scripts/tag.sh) :
#   1. vérification : le tag, le fichier VERSION et tous les fichiers de version concordent ;
#      les notes de version existent (release-notes/X.Y.Z.md, sinon section du CHANGELOG) ;
#   2. tests (API, crawler, moteur Rust) ;
#   3. compilation : wheels du moteur Linux amd64 + arm64 (serveurs, Raspberry Pi…), macOS (universal2)
#      et Windows (au mieux : un échec n'empêche pas la release), sdist, CLI `icc.pyz`, archive des sources ;
#   4. image Docker amd64 + arm64 sur ghcr.io (onglet « Packages »), analysée par Trivy, signée par cosign,
#      avec attestation de provenance et SBOM ;
#   5. release GitHub créée automatiquement, avec les notes, les binaires et SHA256SUMS.

name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Vérifier le tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: v
        run: |
          python3 scripts/version.py check --tag "$GITHUB_REF_NAME" --notes
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Notes de version (release-notes/X.Y.Z.md ou CHANGELOG)
        run: python3 scripts/version.py notes "${GITHUB_REF_NAME#v}" > release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  tests:
    name: Tests avant publication
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --project api --frozen
      - run: uv run --frozen pytest -q -p no:cacheprovider
        working-directory: api
      - run: uv run --with pytest pytest -q -p no:cacheprovider
        working-directory: crawler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo test --manifest-path engine/Cargo.toml --locked

  docker:
    name: Image ${{ matrix.platform }}
    needs: [verify, tests]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Nom d'image (minuscules)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Exporter l'empreinte
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: Publier le manifeste multi-architecture
    needs: docker
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Nom d'image (minuscules)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Créer et pousser le manifeste
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
      - id: inspect
        run: |
          docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}" --format '{{json .Manifest}}' | jq -r '.digest')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attestation de provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true
      - name: Analyse des vulnérabilités (Trivy) — échoue sur une faille CRITIQUE corrigeable
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.inspect.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.inspect.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sbom
          path: sbom.spdx.json
      - uses: sigstore/cosign-installer@v3
      - name: Signature de l'image (cosign, sans clé)
        run: cosign sign --yes "${IMAGE}@${{ steps.inspect.outputs.digest }}"

  wheels:
    name: Moteur Rust ${{ matrix.name }}
    needs: [verify, tests]
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.best_effort }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux amd64", runner: ubuntu-24.04, target: x86_64, best_effort: false }
          - { name: "Linux arm64", runner: ubuntu-24.04-arm, target: aarch64, best_effort: false }
          - { name: "macOS (universal2)", runner: macos-14, target: universal2-apple-darwin, best_effort: true }
          - { name: "Windows amd64", runner: windows-2022, target: x64, best_effort: true }
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter --manifest-path engine/Cargo.toml
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ strategy.job-index }}
          path: dist/*
          if-no-files-found: error

  sources:
    name: Sources, sdist et CLI
    needs: [verify, tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path engine/Cargo.toml
      - name: Archive des sources
        run: |
          v="${{ needs.verify.outputs.version }}"
          git archive --format=tar.gz --prefix="Imperial-CodeCenter-${v}/" -o "dist/Imperial-CodeCenter-${v}-sources.tar.gz" HEAD
      - name: CLI autonome icc.pyz (Python 3.10+, toute architecture)
        run: |
          mkdir -p build/icc/icc_ai
          cp api/src/icc_ai/__init__.py api/src/icc_ai/cli.py api/src/icc_ai/about.py build/icc/icc_ai/
          python3 -m zipapp build/icc -m "icc_ai.cli:main" -p "/usr/bin/env python3" -o dist/icc.pyz
          python3 dist/icc.pyz --help >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sources
          path: dist/*
          if-no-files-found: error

  release:
    name: Release GitHub
    needs: [verify, docker-manifest, wheels, sources]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Sommes de contrôle
        working-directory: dist
        run: sha256sum -- * | tee SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: Imperial CodeCenter ${{ needs.verify.outputs.version }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
