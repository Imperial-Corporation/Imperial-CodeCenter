# pyproject.toml minimal pour un projet Python moderne avec outils de qualité.
[project]
name = "mon-projet"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
