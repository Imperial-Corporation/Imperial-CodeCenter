[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "codecenter-engine"
version = "1.0.4"
requires-python = ">=3.10"
description = "Moteur d'indexation et de recherche d'Imperial CodeCenter"
authors = [{ name = "Imperial" }]
license = { text = "LicenseRef-Imperial-Community-1.0" }

[project.urls]
Homepage = "https://imperial-corporation.pages.dev/icc"
Repository = "https://github.com/Imperial-Corporation/Imperial-CodeCenter"

[tool.maturin]
features = ["pyo3/extension-module"]

[dependency-groups]
dev = [
    "maturin>=1.15.0",
]