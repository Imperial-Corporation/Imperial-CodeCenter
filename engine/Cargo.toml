[package]
name = "codecenter-engine"
version = "1.0.3"
edition = "2024"
license-file = "LICENSE"
authors = ["Imperial <https://imperial-corporation.pages.dev/icc>"]
homepage = "https://imperial-corporation.pages.dev/icc"
repository = "https://github.com/Imperial-Corporation/Imperial-CodeCenter"
description = "Moteur d'indexation et de recherche d'Imperial CodeCenter"

[lib]
name = "codecenter_engine"
crate-type = ["cdylib"]

[dependencies]
# ==========================
# Python implementation
# ==========================
pyo3 = { version = "0.30", features = ["extension-module"] }

# ==========================
# Data manipulation
# ==========================
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ==========================
# Database
# ==========================
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "json",
] }

# ==========================
# Network
# ==========================
tokio = { version = "1", features = [
    "rt-multi-thread",
    "time",
    "sync",
    "macros",
] }

# ==========================
# Files watcher and indexing
# ==========================
notify-debouncer-full = "0.7"

# ==========================
# Others
# ==========================
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }