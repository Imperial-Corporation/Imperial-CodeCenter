[package]
name = "codecenter-engine"
version = "0.1.0"
edition = "2024"

[lib]
name = "codecenter_engine"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "json",
] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }