[project]
name = "codecenter-api"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.27",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../crawler/src"]

[tool.uv]
package = false
