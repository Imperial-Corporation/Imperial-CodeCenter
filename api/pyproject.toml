[project]
name = "codecenter-api"
version = "1.0.3"
requires-python = ">=3.10"
license = { text = "LicenseRef-Imperial-Community-1.0" }
authors = [{ name = "Imperial" }]
dependencies = [
    "cryptography>=43",
    "fastapi>=0.143.2",
    "httpx>=0.27",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.urls]
Homepage = "https://imperial-corporation.pages.dev/icc"
Repository = "https://github.com/Imperial-Corporation/Imperial-CodeCenter"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../crawler/src"]

[tool.uv]
package = false
