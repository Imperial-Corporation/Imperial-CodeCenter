[project]
name = "icc-crawler"
version = "1.0.0"
description = "Crawler GitHub d'Imperial CodeCenter : collecte et range automatiquement des scripts sous licence permissive."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
icc-crawler = "icc_crawler.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = false
