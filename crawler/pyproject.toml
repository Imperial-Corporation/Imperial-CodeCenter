[project]
name = "icc-crawler"
version = "1.0.1"
description = "Crawler GitHub d'Imperial CodeCenter : collecte et range automatiquement des scripts sous licence permissive. Créé par Imperial (https://imperial-corporation.pages.dev/icc)."
requires-python = ">=3.10"
license = { text = "LicenseRef-Imperial-Community-1.0" }
authors = [{ name = "Imperial" }]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://imperial-corporation.pages.dev/icc"

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
icc-crawler = "icc_crawler.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = false
