#
# Secrets dans des fichiers (plutôt que dans .env / l'environnement) :
#
#     mkdir -p secrets && chmod 700 secrets
#     openssl rand -hex 24 > secrets/db_password
#     printf 'postgresql://codecenter:%s@db:5432/imperial_codecenter' "$(cat secrets/db_password)" > secrets/database_url
#     openssl rand -hex 24 > secrets/admin_token            # facultatif
#     chmod 600 secrets/*
#     echo 'POSTGRES_PASSWORD=voir-secrets' >> .env      # valeur factice : exigée par compose.yaml, ignorée ici
#     docker compose -f compose.yaml -f compose.secrets.yaml up -d
#
# Les conteneurs lisent NOM_FILE (voir docs/docker.md) ; aucun secret réel n'est dans .env ni dans l'environnement.

secrets:
  db_password:
    file: ./secrets/db_password
  database_url:
    file: ./secrets/database_url
  admin_token:
    file: ./secrets/admin_token

services:
  db:
    environment:
      POSTGRES_PASSWORD: ""   # remplacé par le fichier ci-dessous
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password

  app:
    environment:
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/database_url
      CODECENTER_ADMIN_TOKEN_FILE: /run/secrets/admin_token
    secrets:
      - database_url
      - admin_token
